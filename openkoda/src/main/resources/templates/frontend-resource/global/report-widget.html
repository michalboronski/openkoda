<!--DEFAULT CONTENT-->
<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en" layout:decorate="~{${defaultLayout}}">
<body>
<div class="container">
    <h1 layout:fragment="title"/>
    <div layout:fragment="content">
        <div th:id="'report-' + ${reportId}"></div>
        <script th:inline="javascript">

            document.addEventListener('DOMContentLoaded', function () {
                let organizationId = /*[[${ organizationEntityId }]]*/ null;
                let reportId = /*[[${ reportId }]]*/ null;
                if (reportId != null) {
                    let targetUrl = organizationId == null ? `/html/queryreport/${reportId}?__view=table`
                        : `/html/organization/${organizationId}/queryreport/${reportId}?__view=table`;
                    fetch(targetUrl)
                        .then(response => response.text())
                        .then(html => {
                            document.getElementById(`report-${reportId}`).innerHTML = html;
                        })
                        .catch(error => console.error('Error:', error));
                }
            });

        </script>
    </div>
</div>
</body>
</html>

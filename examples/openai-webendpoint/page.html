<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en"
      layout:decorate="~{${defaultLayout}}">
<head>
    <title>AI companion</title>
    <style>
        .chat-message {
            padding: 0.5rem;
            margin: 0.25rem;
            border: 1px solid #e3e6f0;
            border-radius: .5rem
        }

        .gpt-message {
            padding: 0 0.75rem;
            border: none;
        }

        .user-message {
            background-color: #e3e6f0;
        }

        .chat-messages {
            margin: 0.5rem 0;
            overflow-y: scroll;
            height: 40vh;
        }

        .gpt-card {
            padding: 0.5rem;
        }

        .card-title {
            flex-grow: 0;
        }

        .create-webendpoint-button-holder-hidden {
            display: none;
        }

        .create-webendpoint-button-holder-showed {
            display: block;
        }

        .loading-hidden {
            display: none;
        }

        .loading-showed {
            display: block;
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:inline="javascript">
        var conversation = {
            id: null,
            firstMessage: true
        }

        app.sendButtonClicked = function () {
            app.handleGptResponse();
        }

        app.handleGptResponse = function () {
            const chatInput = document.querySelector('#chat-input');
            const userMessage = chatInput.value;
            chatInput.value = '';
            document.querySelector('#userMessage').value = userMessage;
            document.querySelector('#isFirstMessage').value = conversation.firstMessage;
            document.querySelector('#conversationId').value = conversation.id;
            const newMessage = document.createElement('div');
            const newContent = document.createTextNode(userMessage);
            newMessage.appendChild(newContent);
            newMessage.classList.add('chat-message');
            newMessage.classList.add('user-message');
            document.querySelector('#chat-holder-content').appendChild(newMessage);
            chatInput.value = '';
            app.loading();
            $.post('', $('#chat-form').serialize(), function (response) {
                conversation.id = response.conversationId;
                if (conversation.firstMessage) {
                    const newMessage = document.createElement('div');
                    newMessage.innerHTML = `<i class="fa-solid fa-exchange text-primary mr-2"></i>New <a target="audit" href="/html/audit/all?audit_page=0&audit_size=20&audit_sort=createdOn%2CDESC&audit_search=` + conversation.id + `">conversation</a> started.`;
                    newMessage.classList.add('chat-message');
                    newMessage.classList.add('gpt-message');
                    document.querySelector('#chat-holder-content').appendChild(newMessage);
                }
                conversation.firstMessage = false;
            })
        }

        app.stringBetween = function (content, quotes, occurence) {
            let startIndex = content.indexOf(quotes) + quotes.length;
            let endIndex = content.indexOf(quotes, startIndex);
            for (let k = 0; k < occurence; k++) {
                startIndex = content.indexOf(quotes, endIndex + quotes.length) + quotes.length;
                endIndex = content.indexOf(quotes, startIndex);
            }
            return content.substring(startIndex, endIndex);
        }

        app.extractResponseToCode = function (message) {
            if(typeof conversation.id !== null){
                let bodyJson = JSON.parse(message.body);
                let conversationId = bodyJson.conversationId;
                if (conversationId != conversation.id) {
                    console.log(`Received different conversation (${conversationId} != ${conversation.id}). Skipping.`);
                    return;
                }
                let response = bodyJson.response;
                response = response.replaceAll(/```[a-z]+/g, "```");
                conversation.htmlCode = app.stringBetween(response, "```", 0);
                conversation.flowCode = app.stringBetween(response, "```", 1);
                let metadata = app.stringBetween(response, "```", 2).split(';');
                conversation.httpMethod = metadata[0].replaceAll(/[^A-Z_]/g, "");
                conversation.subPath = metadata[1].replaceAll("/", "");
                conversation.flowResponseType = metadata[2].replaceAll(/[^A-Z_]/g, "");
                if (conversation.httpMethod === "GET") {
                    conversation.defaultPage = conversation.subPath;
                }
                app.postNewEndpoint();
            }
            else{
                setTimeout(app.extractResponseToCode(message), 250);
            }
        }

        app.postNewEndpoint = function () {
            conversation._csrf = [[${_csrf.token}]];
            $.post('./ai/create', conversation, function (response) {
                conversation.frontendResourceId = response.frontendResourceId;
                const newMessage = document.createElement('div');
                newMessage.innerHTML = `<i class="fa-solid fa-check text-primary mr-2"></i>Done! View <a target="code" href="/html/webEndpoint/` + response.frontendResourceId + `/settings">code</a>. View generated <a target="preview" href="/html/cn/` + conversation.id + `/` + conversation.defaultPage + `">page</a>.`;
                newMessage.classList.add('chat-message');
                newMessage.classList.add('gpt-message');
                document.querySelector('#chat-holder-content').appendChild(newMessage);
                app.loading();
            })
        }

        app.loading = function () {
            const loading = document.querySelector('#loading');
            if (loading.classList.contains('loading-hidden')) {
                loading.classList.remove('loading-hidden');
                loading.classList.add('loading-show');
            } else {
                loading.classList.add('loading-hidden');
                loading.classList.remove('loading-show');
            }
        }

        $(document).ready(function () {
            app.subscribeToChannel("/user/queue/ai", app.extractResponseToCode);
        });
    </script>
</head>

<body>
<div class="container">
    <h1 layout:fragment="title"/>
    <div class="" layout:fragment="content" th:attr="data-menu-item='development'">
        <nav th:replace="~{development-kit-fragments::dev-kit-nav-tabs('ai')}"></nav>
        <div class="card shadow mb-4 form-parent col-12 gpt-card">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between"><h6
                    class="m-0 font-weight-bold">Chat</h6></div>
            <div id="chat-holder-content" class="chat-messages"></div>
        </div>
        <div class="col text-center form-group">
            <textarea class="form-control" id="chat-input" placeholder="Describe view and logic here2..."></textarea>
        </div>
        <form id="chat-form" name="chat-form" method="post" action="./ai" class="mb-4">
            <th:block th:replace="~{forms::csrf}"/>
            <input id="firstMessagePrompt" type="hidden" name="firstMessagePrompt" th:value="${firstMessagePrompt}"/>
            <input id="isFirstMessage" type="hidden" name="isFirstMessage"/>
            <input id="conversationId" type="hidden" name="conversationId"/>
            <input id="userMessage" type="hidden" th:name="userMessage"/>

            <div class="col text-center">
                <button class="btn btn-primary btn-submit"
                        onclick="app.sendButtonClicked()"
                        type="button"
                        th:text="Send"></button>
            </div>
        </form>

        <div class="col-2 d-none">
            <div class="form-group">
                <div>
                    <label for="model-select" th:text="Model"></label>
                    <select id="model-select" class="selectpicker type1 form-control" form="chat-form" name="model"
                            placeholder="model">
                        <option value="gpt-4">4</option>
                        <option value="gpt-3.5-turbo">3.5-turbo</option>
                        <option value="gpt-3.5-turbo-0613">3.5-turbo (0613)</option>
                        <option value="davinci">3 (davinci)</option>
                        <option value="curie">3 (curie)</option>
                        <option value="babbage">3 (babbage)</option>
                        <option value="ada">3 (ada)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div>
                    <label for="temperature" th:text="#{openai.temperature}"></label>
                    <input id="temperature" class="type1 form-control" form="chat-form" name="temperature"
                           placeholder="eg. 0.5"
                           type="text" value="0.1"/>
                </div>
            </div>
        </div>
        <div id="loading" class="loading-hidden">
            <th:block th:replace="~{snippets::loading}"/>
        </div>
    </div>
</div>
</body>
</html>
